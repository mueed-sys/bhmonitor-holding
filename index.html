<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bhmonitor — temporarily offline</title>
    <meta name="description" content="bhmonitor is undergoing scheduled maintenance. We will be back online shortly." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *,*::before,*::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at top, #0f1a2c 0%, #060a14 70%);
        color: #e6ecf5;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        line-height: 1.5;
      }
      .frame {
        max-width: 560px;
        width: 100%;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.03);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        color: #aab5c7;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f59e0b;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(0.85); }
      }
      h1 {
        margin: 28px 0 16px;
        font-size: clamp(28px, 5vw, 40px);
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .brand {
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 auto;
        max-width: 440px;
        color: #aab5c7;
        font-size: 16px;
        font-weight: 300;
      }
      .meta {
        margin-top: 36px;
        padding-top: 24px;
        border-top: 1px solid rgba(255,255,255,0.06);
        display: flex;
        justify-content: center;
        gap: 24px;
        flex-wrap: wrap;
        font-size: 13px;
        color: #6b7689;
      }
      .meta a {
        color: #aab5c7;
        text-decoration: none;
        border-bottom: 1px solid rgba(170,181,199,0.2);
        transition: color 0.15s, border-color 0.15s;
      }
      .meta a:hover {
        color: #ffffff;
        border-bottom-color: rgba(255,255,255,0.6);
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <span class="badge"><span class="dot" aria-hidden="true"></span>Maintenance in progress</span>
      <h1><span class="brand">bhmonitor</span> is temporarily offline</h1>
      <p>We are migrating bhmonitor to new infrastructure to improve reliability and performance. The service will be back online shortly. Thank you for your patience.</p>
      <div class="meta">
        <span>Bahrain Safety Monitor</span>
      </div>
    </main>
  </body>
</html>
